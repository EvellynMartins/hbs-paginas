<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9EFE7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F2D9D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C9BC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8C87A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8C87A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="1600" fill="url(#bg)" />

  <!-- Borda decorativa externa -->
  <rect x="30" y="30" width="1140" height="1540" rx="4" fill="none" stroke="url(#gold)" stroke-width="2" />
  <rect x="50" y="50" width="1100" height="1500" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.6" />

  <!-- Ornamento topo -->
  <line x1="200" y1="120" x2="1000" y2="120" stroke="url(#gold)" stroke-width="1.5" />
  <circle cx="600" cy="120" r="6" fill="url(#gold)" />
  <circle cx="200" cy="120" r="4" fill="url(#gold)" />
  <circle cx="1000" cy="120" r="4" fill="url(#gold)" />
  <line x1="200" y1="130" x2="560" y2="130" stroke="url(#gold)" stroke-width="0.5" opacity="0.4" />
  <line x1="640" y1="130" x2="1000" y2="130" stroke="url(#gold)" stroke-width="0.5" opacity="0.4" />

  <!-- Flor decorativa topo -->
  <g transform="translate(600, 220)">
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(0)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(45)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(90)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(135)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(180)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(225)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(270)" />
    <ellipse cx="0" cy="-40" rx="18" ry="28" fill="#D4A5A0" opacity="0.7" transform="rotate(315)" />
    <circle cx="0" cy="0" r="20" fill="url(#gold)" opacity="0.9" />
    <circle cx="0" cy="0" r="12" fill="#F9EFE7" />
    <circle cx="0" cy="0" r="6" fill="url(#gold)" />
  </g>

  <!-- Ano 2027 decorativo acima do título -->
  <text x="600" y="370" font-family="Georgia, serif" font-size="28" fill="url(#gold)" text-anchor="middle" letter-spacing="12">✦  2 0 2 7  ✦</text>

  <!-- Linha separadora dourada -->
  <line x1="250" y1="400" x2="950" y2="400" stroke="url(#gold)" stroke-width="1" />

  <!-- Título principal -->
  <text x="600" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#6B3E3E" text-anchor="middle" font-weight="normal" letter-spacing="2">Planner</text>
  <text x="600" y="630" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#6B3E3E" text-anchor="middle" font-weight="normal" letter-spacing="2">Digital</text>

  <!-- Linha separadora -->
  <line x1="350" y1="670" x2="850" y2="670" stroke="url(#gold)" stroke-width="1.5" />
  <circle cx="600" cy="670" r="5" fill="url(#gold)" />

  <!-- Subtítulo -->
  <text x="600" y="730" font-family="'Gill Sans', Calibri, sans-serif" font-size="30" fill="#8B5E5E" text-anchor="middle" letter-spacing="1">Organize sua rotina,</text>
  <text x="600" y="775" font-family="'Gill Sans', Calibri, sans-serif" font-size="30" fill="#8B5E5E" text-anchor="middle" letter-spacing="1">finanças e metas</text>

  <!-- Ilustração central — ramo floral estilizado -->
  <!-- Caule esquerdo -->
  <path d="M400,1050 Q380,950 350,880" stroke="#C9A96E" stroke-width="2" fill="none" />
  <ellipse cx="335" cy="855" rx="22" ry="35" fill="#E8C5C0" opacity="0.8" transform="rotate(-20, 335, 855)" />
  <ellipse cx="355" cy="830" rx="18" ry="28" fill="#D4A5A0" opacity="0.9" transform="rotate(-30, 355, 830)" />
  <ellipse cx="370" cy="870" rx="20" ry="30" fill="#F0D5D0" opacity="0.8" transform="rotate(10, 370, 870)" />

  <!-- Caule direito -->
  <path d="M800,1050 Q820,950 850,880" stroke="#C9A96E" stroke-width="2" fill="none" />
  <ellipse cx="865" cy="855" rx="22" ry="35" fill="#E8C5C0" opacity="0.8" transform="rotate(20, 865, 855)" />
  <ellipse cx="845" cy="830" rx="18" ry="28" fill="#D4A5A0" opacity="0.9" transform="rotate(30, 845, 830)" />
  <ellipse cx="830" cy="870" rx="20" ry="30" fill="#F0D5D0" opacity="0.8" transform="rotate(-10, 830, 870)" />

  <!-- Caule central -->
  <path d="M600,1050 Q600,950 600,880" stroke="#C9A96E" stroke-width="2" fill="none" />
  <!-- Rosa central -->
  <g transform="translate(600, 840)">
    <ellipse cx="0" cy="-35" rx="22" ry="32" fill="#E8C5C0" opacity="0.8" transform="rotate(0)" />
    <ellipse cx="0" cy="-35" rx="22" ry="32" fill="#D4A5A0" opacity="0.8" transform="rotate(60)" />
    <ellipse cx="0" cy="-35" rx="22" ry="32" fill="#E8C5C0" opacity="0.8" transform="rotate(120)" />
    <ellipse cx="0" cy="-35" rx="22" ry="32" fill="#D4A5A0" opacity="0.8" transform="rotate(180)" />
    <ellipse cx="0" cy="-35" rx="22" ry="32" fill="#E8C5C0" opacity="0.8" transform="rotate(240)" />
    <ellipse cx="0" cy="-35" rx="22" ry="32" fill="#D4A5A0" opacity="0.8" transform="rotate(300)" />
    <circle cx="0" cy="0" r="18" fill="#C9A96E" opacity="0.9" />
    <circle cx="0" cy="0" r="10" fill="#F9EFE7" />
  </g>

  <!-- Folhas decorativas -->
  <ellipse cx="500" cy="950" rx="14" ry="35" fill="#B5C9A0" opacity="0.6" transform="rotate(-40, 500, 950)" />
  <ellipse cx="700" cy="950" rx="14" ry="35" fill="#B5C9A0" opacity="0.6" transform="rotate(40, 700, 950)" />
  <ellipse cx="460" cy="1000" rx="12" ry="28" fill="#A5BA90" opacity="0.5" transform="rotate(-60, 460, 1000)" />
  <ellipse cx="740" cy="1000" rx="12" ry="28" fill="#A5BA90" opacity="0.5" transform="rotate(60, 740, 1000)" />

  <!-- Linha -->
  <line x1="200" y1="1100" x2="1000" y2="1100" stroke="url(#gold)" stroke-width="1" />

  <!-- Recursos do planner -->
  <text x="600" y="1160" font-family="'Gill Sans', Calibri, sans-serif" font-size="24" fill="#8B5E5E" text-anchor="middle" letter-spacing="2">✦  METAS  ✦  HÁBITOS  ✦  FINANÇAS  ✦</text>

  <!-- Linha separadora -->
  <line x1="200" y1="1200" x2="1000" y2="1200" stroke="url(#gold)" stroke-width="1" />

  <!-- Espaço HBS marca -->
  <rect x="450" y="1280" width="300" height="80" rx="40" fill="none" stroke="url(#gold)" stroke-width="1.5" />
  <text x="600" y="1332" font-family="Georgia, serif" font-size="32" fill="url(#gold)" text-anchor="middle" letter-spacing="6">HBS</text>

  <!-- Tagline -->
  <text x="600" y="1430" font-family="'Gill Sans', Calibri, sans-serif" font-size="20" fill="#A07070" text-anchor="middle" letter-spacing="3">hbs.digital</text>

  <!-- Ornamento base -->
  <line x1="200" y1="1470" x2="1000" y2="1470" stroke="url(#gold)" stroke-width="1.5" />
  <circle cx="600" cy="1470" r="6" fill="url(#gold)" />
  <circle cx="200" cy="1470" r="4" fill="url(#gold)" />
  <circle cx="1000" cy="1470" r="4" fill="url(#gold)" />
</svg>