<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9EFE7;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F2D9D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5C3B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8C87A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C87A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B3E3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A2020;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowBanner">
      <feDropShadow dx="3" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.2)" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="628" fill="url(#bgBanner)" />

  <!-- Borda dourada -->
  <rect x="12" y="12" width="1176" height="604" rx="4" fill="none" stroke="url(#goldBanner)" stroke-width="2" />

  <!-- Painel escuro esquerdo — mini capa do produto -->
  <rect x="50" y="50" width="320" height="528" rx="8" fill="url(#darkPanel)" filter="url(#shadowBanner)" />

  <!-- Ornamento floral mini capa -->
  <g transform="translate(210, 160)">
    <ellipse cx="0" cy="-28" rx="12" ry="18" fill="#E8C5C0" opacity="0.7" transform="rotate(0)" />
    <ellipse cx="0" cy="-28" rx="12" ry="18" fill="#D4A5A0" opacity="0.7" transform="rotate(60)" />
    <ellipse cx="0" cy="-28" rx="12" ry="18" fill="#E8C5C0" opacity="0.7" transform="rotate(120)" />
    <ellipse cx="0" cy="-28" rx="12" ry="18" fill="#D4A5A0" opacity="0.7" transform="rotate(180)" />
    <ellipse cx="0" cy="-28" rx="12" ry="18" fill="#E8C5C0" opacity="0.7" transform="rotate(240)" />
    <ellipse cx="0" cy="-28" rx="12" ry="18" fill="#D4A5A0" opacity="0.7" transform="rotate(300)" />
    <circle cx="0" cy="0" r="14" fill="url(#goldBanner)" opacity="0.9" />
    <circle cx="0" cy="0" r="8" fill="#4A2020" />
  </g>

  <!-- Textos da mini capa -->
  <text x="210" y="100" font-family="Georgia, serif" font-size="14" fill="url(#goldBanner)" text-anchor="middle" letter-spacing="4">✦ 2027 ✦</text>
  <line x1="90" y1="115" x2="330" y2="115" stroke="url(#goldBanner)" stroke-width="0.8" />

  <text x="210" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="white" text-anchor="middle" font-weight="normal">Planner</text>
  <text x="210" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="white" text-anchor="middle" font-weight="normal">Digital</text>

  <line x1="110" y1="302" x2="310" y2="302" stroke="url(#goldBanner)" stroke-width="1" />
  <circle cx="210" cy="302" r="4" fill="url(#goldBanner)" />

  <text x="210" y="335" font-family="'Gill Sans', Calibri, sans-serif" font-size="16" fill="#F2D9D0" text-anchor="middle" letter-spacing="1">Rotina · Finanças · Metas</text>

  <!-- Elementos decorativos mini -->
  <text x="210" y="430" font-family="'Gill Sans', sans-serif" font-size="13" fill="#E8C87A" text-anchor="middle" opacity="0.8">✦  METAS  ✦</text>
  <text x="210" y="455" font-family="'Gill Sans', sans-serif" font-size="13" fill="#E8C87A" text-anchor="middle" opacity="0.8">✦  HÁBITOS  ✦</text>
  <text x="210" y="480" font-family="'Gill Sans', sans-serif" font-size="13" fill="#E8C87A" text-anchor="middle" opacity="0.8">✦  FINANÇAS  ✦</text>

  <line x1="90" y1="510" x2="330" y2="510" stroke="url(#goldBanner)" stroke-width="0.8" />
  <rect x="150" y="530" width="120" height="28" rx="14" fill="none" stroke="url(#goldBanner)" stroke-width="1" />
  <text x="210" y="549" font-family="Georgia, serif" font-size="16" fill="url(#goldBanner)" text-anchor="middle" letter-spacing="4">HBS</text>

  <!-- Área direita — copy e CTA -->
  <!-- Badge NOVO -->
  <rect x="420" y="55" width="80" height="28" rx="14" fill="#E8C5C0" />
  <text x="460" y="74" font-family="'Gill Sans', sans-serif" font-size="13" fill="#6B3E3E" text-anchor="middle" font-weight="bold" letter-spacing="2">NOVO</text>

  <!-- Título principal -->
  <text x="420" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#6B3E3E" font-weight="normal">Planner</text>
  <text x="420" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#6B3E3E" font-weight="normal">Digital 2027</text>

  <!-- Linha dourada -->
  <line x1="420" y1="225" x2="820" y2="225" stroke="url(#goldBanner)" stroke-width="2" />

  <!-- Subtítulo -->
  <text x="420" y="270" font-family="'Gill Sans', Calibri, sans-serif" font-size="24" fill="#8B5E5E">Organize sua rotina, finanças</text>
  <text x="420" y="300" font-family="'Gill Sans', Calibri, sans-serif" font-size="24" fill="#8B5E5E">e metas com leveza</text>

  <!-- Bullets / features -->
  <circle cx="432" cy="350" r="5" fill="#C9A96E" />
  <text x="448" y="356" font-family="'Gill Sans', sans-serif" font-size="18" fill="#6B3E3E">Calendário mensal e semanal</text>

  <circle cx="432" cy="385" r="5" fill="#C9A96E" />
  <text x="448" y="391" font-family="'Gill Sans', sans-serif" font-size="18" fill="#6B3E3E">Tracker de hábitos</text>

  <circle cx="432" cy="420" r="5" fill="#C9A96E" />
  <text x="448" y="426" font-family="'Gill Sans', sans-serif" font-size="18" fill="#6B3E3E">Controle financeiro mensal</text>

  <circle cx="432" cy="455" r="5" fill="#C9A96E" />
  <text x="448" y="461" font-family="'Gill Sans', sans-serif" font-size="18" fill="#6B3E3E">Planejamento de metas anuais</text>

  <!-- Preço -->
  <text x="420" y="535" font-family="'Gill Sans', sans-serif" font-size="16" fill="#A07070" text-decoration="line-through">De R$ 67</text>
  <text x="420" y="590" font-family="Georgia, serif" font-size="64" fill="#6B3E3E" font-weight="bold">R$ 37</text>

  <!-- CTA Botão -->
  <rect x="880" y="450" width="280" height="70" rx="35" fill="url(#ctaGrad)" filter="url(#shadowBanner)" />
  <text x="1020" y="492" font-family="Georgia, serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="1">Compre agora</text>

  <!-- Seta no botão -->
  <text x="1140" y="492" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle">→</text>

  <!-- Garantia -->
  <text x="1020" y="545" font-family="'Gill Sans', sans-serif" font-size="13" fill="#8B5E5E" text-anchor="middle">✓  Acesso imediato  ·  ✓  PDF + Digital</text>

  <!-- Logo HBS canto direito -->
  <text x="1155" y="40" font-family="Georgia, serif" font-size="18" fill="url(#goldBanner)" text-anchor="end" letter-spacing="4">HBS</text>
  <text x="1155" y="58" font-family="'Gill Sans', sans-serif" font-size="11" fill="#A07070" text-anchor="end" letter-spacing="2">hbs.digital</text>
</svg>